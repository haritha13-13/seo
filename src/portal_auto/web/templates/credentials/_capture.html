<div class="capture-panel stack">
  {% if capture %}
  <p>Capture open until {{ capture.expires_at | utc }}</p>
  <div class="actions">
    <form method="post" action="{{ url_for('credentials.save_capture', credential_id=credential.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="primary">Save session</button>
    </form>
    <form method="post" action="{{ url_for('credentials.cancel_capture', credential_id=credential.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Cancel capture</button>
    </form>
  </div>
  {% elif other_capture %}
  <p class="muted">Capture is unavailable: another capture is open (for credential {{ other_capture.credential_id }}) until {{ other_capture.expires_at | utc }}. Save or cancel it first.</p>
  <button type="button" disabled>Capture in Chrome</button>
  {% else %}
  <form method="post" action="{{ url_for('credentials.start_capture', credential_id=credential.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="primary">Capture in Chrome</button>
  </form>
  {% endif %}
</div>
